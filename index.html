<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2D5016" />

    <!-- Favicons + manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Canonical -->
    <link rel="canonical" href="https://herbyte.cereustechnologies.com/" />

    <!-- Search / SEO -->
    <title>Herbyte — Learn herbs. Safely.</title>
    <meta
      name="description"
      content="A community-built herbal-medicine reference: herbs, remedies, seller marketplace and workshops — with evidence ratings, drug-interaction checks, and an AI-assisted safety review on every community submission."
    />
    <meta
      name="keywords"
      content="herbal medicine, herbs, remedies, herbalism, phytotherapy, drug interactions, natural health, herbal safety, herbal reference, Herbyte"
    />
    <meta name="author" content="Herbyte" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph — Facebook, LinkedIn, WhatsApp, Discord, Slack, iMessage.
         PNG is the primary og:image so every crawler renders a card;
         some (older Twitter, WhatsApp, iMessage) refuse SVG. -->
    <meta property="og:site_name" content="Herbyte" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://herbyte.cereustechnologies.com/" />
    <meta property="og:title" content="Herbyte — Learn herbs. Safely." />
    <meta
      property="og:description"
      content="A community-built herbal-medicine reference: herbs, remedies, seller marketplace and workshops — with evidence ratings, drug-interaction checks, and an AI-assisted safety review on every community submission."
    />
    <meta property="og:image" content="https://herbyte.cereustechnologies.com/og.png" />
    <meta property="og:image:secure_url" content="https://herbyte.cereustechnologies.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Herbyte — Learn herbs. Safely." />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://herbyte.cereustechnologies.com/" />
    <meta name="twitter:title" content="Herbyte — Learn herbs. Safely." />
    <meta
      name="twitter:description"
      content="A community-built herbal-medicine reference: herbs, remedies, seller marketplace and workshops. Evidence-rated, safety-first."
    />
    <meta name="twitter:image" content="https://herbyte.cereustechnologies.com/og.png" />
    <meta name="twitter:image:alt" content="Herbyte — Learn herbs. Safely." />

    <!-- Apple / iOS -->
    <meta name="apple-mobile-web-app-title" content="Herbyte" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
